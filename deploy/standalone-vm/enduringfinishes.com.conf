server {
    listen 80;
    listen [::]:80;
    server_name enduringfinishes.com www.enduringfinishes.com;

    root /var/www/enduringfinishes.com;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
